name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-tag.cjs
      - run: pnpm test
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/installer/*Setup*.exe
            release/installer/*.blockmap
            release/installer/latest.yml
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "%GITHUB_REF_NAME%" >nul 2>&1
          if errorlevel 1 (
            gh release create "%GITHUB_REF_NAME%" release/installer/*Setup*.exe release/installer/*.blockmap release/installer/latest.yml --verify-tag --title "小红书更新监控 %GITHUB_REF_NAME%" --notes-file docs/RELEASE_NOTES.md
          ) else (
            echo Release already published. Keeping its verified assets.
          )
